name: Publish parent website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - run: npm test
        working-directory: website
      - run: npm test
        working-directory: website
        env:
          SITE_BASE_PATH: /SkillSprout-Arcade
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
